questions:
  - id: Q1
    question: "Quelle phrase transmet l'observation la plus utile ?"
    choix:
      - "Mon cheval a une pourriture de fourchette."
      - "Zone sombre et souple, environ 2 cm, lacune centrale de l'antérieur gauche, remarquée hier."
      - "Son pied est bizarre."
    bonne_reponse: 2
    explication: "B décrit l'aspect, la taille, l'endroit et le moment observé. Le diagnostic médical relève du vétérinaire."
    action_urgente: ""
    source_ids: [SRC-002]
    validation_eric: "requise"
  - id: Q2
    question: "Quelle photo est la plus utile au professionnel ?"
    choix:
      - "Une photo filtrée du cheval entier."
      - "Un gros plan net avec une règle, plus une vue générale du pied."
      - "Une seule photo prise de loin."
    bonne_reponse: 2
    explication: "B donne une échelle et situe la zone. La photo reste un complément : elle ne remplace pas l'examen."
    action_urgente: ""
    source_ids: []
    validation_eric: "requise"
  - id: Q3
    question: "Le cheval se met brutalement à boiter et refuse presque l'appui. Que faire ?"
    choix:
      - "Attendre le lendemain pour comparer."
      - "Demander l'avis majoritaire d'un groupe en ligne."
      - "Contacter immédiatement le vétérinaire et ne pas faire marcher le cheval pour le tester."
    bonne_reponse: 3
    explication: "C : une boiterie brutale et marquée ne doit pas attendre la fin d'un quiz. Le maréchal intervient en complément selon le cas."
    action_urgente: "Contactez immédiatement votre vétérinaire."
    source_ids: [SRC-001]
    validation_eric: "requise"


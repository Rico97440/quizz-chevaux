titre: "Sais-tu observer un sabot sans diagnostiquer ?"
serie: "Vrai, faux ou incomplet ?"
statut: "medias-a-controler"
cta: "Écrivez A, B ou C en commentaire."
avertissement: "Observer aide le professionnel. Cela ne remplace jamais son examen."
validation_globale_eric: "requise avant publication"
sources:

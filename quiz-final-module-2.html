<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Final Module 2 | EquiCare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1F4E78 0%, #0d2a4a 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1F4E78 0%, #2d5fa3 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .header .stats {
            font-size: 12px;
            opacity: 0.8;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .content {
            padding: 40px;
        }

        .progress-section {
            margin-bottom: 30px;
        }

        .progress-bar {
            background: #ddd;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #1F4E78 0%, #2d5fa3 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 13px;
            color: #666;
            font-weight: 600;
        }

        .quiz-container {
            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        .question-box {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .question-number {
            color: #1F4E78;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .option:hover {
            border-color: #1F4E78;
            background: #f8f9ff;
        }

        .option input[type="radio"] {
            margin-right: 12px;
            margin-top: 2px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1F4E78;
            flex-shrink: 0;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            color: #333;
            font-size: 15px;
        }

        .explanation {
            background: linear-gradient(135deg, #E8F5FF 0%, #F0F8FF 100%);
            border-left: 4px solid #1F4E78;
            padding: 14px;
            border-radius: 4px;
            margin-top: 12px;
            font-size: 13px;
            color: #333;
            display: none;
            line-height: 1.5;
        }

        .explanation.show {
            display: block;
        }

        .explanation strong {
            color: #1F4E78;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1F4E78 0%, #2d5fa3 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(31, 78, 120, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-container {
            display: none;
            text-align: center;
        }

        .results-container.active {
            display: block;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1F4E78 0%, #2d5fa3 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 48px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(31, 78, 120, 0.3);
        }

        .score-message {
            font-size: 24px;
            font-weight: 700;
            color: #1F4E78;
            margin-bottom: 15px;
        }

        .score-details {
            background: linear-gradient(135deg, #F5F5F5 0%, #E8E8E8 100%);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .results-analysis {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .results-analysis h3 {
            color: #1F4E78;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .results-analysis ul {
            list-style: none;
            padding-left: 0;
        }

        .results-analysis li {
            padding: 8px 0;
            color: #666;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
        }

        .results-analysis li:last-child {
            border-bottom: none;
        }

        .results-analysis li.correct::before {
            content: "✅ ";
            color: #70AD47;
            font-weight: 700;
        }

        .results-analysis li.incorrect::before {
            content: "❌ ";
            color: #e74c3c;
            font-weight: 700;
        }

        .footer {
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #FFB84D 0%, #FF9F1C 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }

            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .question-text {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- EN-TÊTE -->
    <div class="header">
        <h1>🎓 Quiz Final Module 2</h1>
        <p>Cinq situations terrain : observer, mesurer, comprendre</p>
        <div class="stats">
            <span>📌 6 questions</span>
            <span>⏱️ 5-7 minutes</span>
            <span>🎯 Validation Module 2</span>
        </div>
        <div class="badge">Diagnostic avant modification</div>
    </div>

    <div class="content">
        <!-- BARRE DE PROGRESSION -->
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Question 0/6</div>
        </div>

        <!-- CONTENEUR QUIZ -->
        <div class="quiz-container active" id="quizContainer">
            <div id="questionContainer"></div>
            <div class="buttons">
                <button class="btn btn-secondary" id="btnPrev" onclick="previousQuestion()" disabled>← Précédent</button>
                <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Suivant →</button>
            </div>
        </div>

        <!-- CONTENEUR RÉSULTATS -->
        <div class="results-container" id="resultsContainer">
            <div class="score-circle" id="scoreCircle">0%</div>
            <div class="score-message" id="scoreMessage">Résultat</div>
            <div class="score-details" id="scoreDetails"></div>
            <div class="results-analysis" id="resultsAnalysis"></div>
            <div class="buttons">
                <button class="btn btn-primary" onclick="restartQuiz()">🔄 Recommencer</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>📌 Quiz EquiCare — Module 2 Validation</p>
        <p>Cushing • Ulcères • Comportement • Diagnostic différentiel</p>
    </div>
</div>

<!-- QUIZ DATA & SCRIPT -->
<script>
const quizData = [
    {
        question: "Un cheval PPID est-il automatiquement insulinorésistant ?",
        options: [
            "Oui, toujours",
            "Non",
            "Seulement après 20 ans"
        ],
        correct: 1,
        explanation: "Le PPID (pituitary pars intermedia dysfunction) et la dysrégulation insulinique peuvent être associés mais ne sont pas synonymes. Vérifier l'insulinémie avec un test dédié, pas supposer automatiquement."
    },
    {
        question: "Quelle est la première chose à faire avant de changer complètement une ration ?",
        options: [
            "Acheter un aliment senior",
            "Ajouter un CMV",
            "Faire le bilan du cheval et de ce qu'il mange réellement"
        ],
        correct: 2,
        explanation: "Le diagnostic avant modification = principe fondamental. Photos, NEC, PT/HG, ration pesée, examen clinique. Sans ce bilan, vous modifiez en aveugle."
    },
    {
        question: "Pourquoi peser les aliments ?",
        options: [
            "Pour connaître réellement les quantités distribuées",
            "Pour remplir les sacs",
            "Cela n'a pas d'importance"
        ],
        correct: 0,
        explanation: "Peser = connaître réellement. « Un peu de grain » peut être 1 kg ou 4 kg. Sans chiffres, toute analyse nutritionnelle est du devinette."
    },
    {
        question: "Un changement soudain de comportement signifie obligatoirement que le cheval manque de magnésium.",
        options: [
            "Vrai",
            "Faux"
        ],
        correct: 1,
        explanation: "Faux. Un changement comportemental doit être replacé dans son contexte : douleur, stress, changement d'environnement, pathologie latente, nutrition. Pas sauter à magnésium automatiquement."
    },
    {
        question: "Chez un senior qui perd de l'état, quelle information mérite notamment d'être vérifiée ?",
        options: [
            "Sa couleur de robe",
            "Sa capacité à mâcher correctement",
            "La couleur de son seau"
        ],
        correct: 1,
        explanation: "La perte de poids chez senior = 45-50% due à usure dentaire (IFCE). Avant changer ration, examen dentaire obligatoire. Aliment indigeste à un cheval qui ne peut pas mâcher = inutile."
    },
    {
        question: "Quelle phrase résume le mieux ce module ?",
        options: [
            "Chaque pathologie possède son aliment miracle.",
            "Plus un cheval est âgé, plus il faut ajouter de compléments.",
            "Observer, mesurer et comprendre avant de modifier."
        ],
        correct: 2,
        explanation: "Le fondement du Module 2 : diagnostic rigoureux avant toute action. Cinq situations terrain, approches différentes, mais toujours : observer d'abord, puis agir."
    }
];

let currentQuestion = 0;
let answers = new Array(quizData.length).fill(null);

function renderQuestion() {
    const q = quizData[currentQuestion];
    const container = document.getElementById('questionContainer');
    
    const html = `
        <div class="question-box">
            <div class="question-number">Question ${currentQuestion + 1} / ${quizData.length}</div>
            <div class="question-text">${q.question}</div>
            <div class="options" id="optionsContainer">
                ${q.options.map((option, idx) => `
                    <div class="option" id="option-${idx}">
                        <input type="radio" name="answer" id="opt_${idx}" value="${idx}" 
                            ${answers[currentQuestion] === idx ? 'checked' : ''}
                            onchange="selectAnswer(${idx})">
                        <label for="opt_${idx}">${String.fromCharCode(65 + idx)}. ${option}</label>
                    </div>
                    <div class="explanation" id="explanation-${idx}">
                        <strong>💡 Explication :</strong> ${q.explanation}
                    </div>
                `).join('')}
            </div>
        </div>
    `;
    
    container.innerHTML = html;
    updateProgressBar();
    updateButtons();
    
    if (answers[currentQuestion] !== null) {
        document.getElementById(`explanation-${answers[currentQuestion]}`).classList.add('show');
    }
}

function selectAnswer(idx) {
    answers[currentQuestion] = idx;
    updateButtons();
    document.getElementById(`explanation-${idx}`).classList.add('show');
}

function nextQuestion() {
    if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        renderQuestion();
        window.scrollTo(0, document.querySelector('.question-box').offsetTop - 100);
    } else {
        showResults();
    }
}

function previousQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
        window.scrollTo(0, document.querySelector('.question-box').offsetTop - 100);
    }
}

function updateButtons() {
    document.getElementById('btnPrev').disabled = currentQuestion === 0;
    document.getElementById('btnNext').innerHTML = currentQuestion === quizData.length - 1 ? '✅ Voir résultats' : 'Suivant →';
    document.getElementById('btnNext').disabled = answers[currentQuestion] === null;
}

function updateProgressBar() {
    const progress = ((currentQuestion + 1) / quizData.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressText').textContent = `Question ${currentQuestion + 1}/${quizData.length}`;
}

function showResults() {
    const score = answers.filter((ans, idx) => ans === quizData[idx].correct).length;
    const percentage = Math.round((score / quizData.length) * 100);
    
    let message, details;
    
    if (percentage >= 100) {
        message = "🏆 Parfait ! Maîtrise complète";
        details = `${score}/${quizData.length} réponses correctes<br>Vous avez compris le cœur du Module 2. Prêt pour la clinique.`;
    } else if (percentage >= 83) {
        message = "✅ Excellent";
        details = `${score}/${quizData.length} réponses correctes<br>Très bonne compréhension. Une nuance à vérifier.`;
    } else if (percentage >= 67) {
        message = "👍 Bon";
        details = `${score}/${quizData.length} réponses correctes<br>Bases solides. Relisez un cas pédagogique.`;
    } else if (percentage >= 50) {
        message = "📚 À améliorer";
        details = `${score}/${quizData.length} réponses correctes<br>Relisez l'article et les cas Module 2.`;
    } else {
        message = "🔍 À revoir";
        details = `${score}/${quizData.length} réponses correctes<br>Diagnostic avant modification = clé. Étudier plus.`;
    }

    let analysisHTML = '<h3>📊 Analyse détaillée</h3><ul>';
    
    answers.forEach((ans, idx) => {
        if (ans === quizData[idx].correct) {
            analysisHTML += `<li class="correct">Q${idx + 1} : Correct</li>`;
        } else {
            analysisHTML += `<li class="incorrect">Q${idx + 1} : Incorrect (bonne réponse : ${String.fromCharCode(65 + quizData[idx].correct)})</li>`;
        }
    });
    analysisHTML += '</ul>';

    document.getElementById('quizContainer').classList.remove('active');
    document.getElementById('resultsContainer').classList.add('active');
    document.getElementById('scoreCircle').innerHTML = percentage + '%';
    document.getElementById('scoreMessage').innerHTML = message;
    document.getElementById('scoreDetails').innerHTML = details;
    document.getElementById('resultsAnalysis').innerHTML = analysisHTML;
    
    window.scrollTo(0, 0);
}

function restartQuiz() {
    currentQuestion = 0;
    answers = new Array(quizData.length).fill(null);
    document.getElementById('quizContainer').classList.add('active');
    document.getElementById('resultsContainer').classList.remove('active');
    renderQuestion();
    window.scrollTo(0, 0);
}

// Initialiser
document.addEventListener('DOMContentLoaded', () => {
    renderQuestion();
});
</script>

</body>
</html>
